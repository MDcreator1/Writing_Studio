<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lekhak Manch — News Article Editor</title>
  <link rel="stylesheet" href="assets/shared/css/00-base.css?v=20260906-theme-variants">
  <link rel="stylesheet" href="assets/shared/css/01-find-modals.css?v=20260905-custom-select-option-borders">
  <link rel="stylesheet" href="assets/pages/news-article-editor/css/00-news-editor.css?v=20260611-newsdesk-floating-tools">
  <link rel="stylesheet" href="assets/shared/css/99-theme-overrides.css?v=20260906-lagoon-muted">
</head>

<body data-page="news-editor">
  <div class="app-loader lm-id-appLoader" id="appLoader" hidden aria-live="polite" aria-busy="true">
    <div class="app-loader-card">
      <div class="app-loader-mark" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="app-loader-text lm-id-appLoaderText" id="appLoaderText">Working...</div>
    </div>
  </div>

  <div id="top-bar" class="lm-id-top-bar app-top-bar">
    <h1>
      <a class="brand-home-link" href="home.html" aria-label="Go to home">
        <span class="brand-mark">LM</span><span id="brandName" class="lm-id-brandName">Lekhak Manch</span>
      </a>
    </h1>

    <div class="tb-group topbar-actions">
      <button class="tb-icon lm-id-projectBtn" id="projectBtn" type="button" onclick="selectNewsWorkspaceFolder()"
        title="Open Workspace Folder" aria-label="Open Workspace Folder">
        <span data-lm-icon="projectFolderDefault"></span>
        <span data-lm-icon="projectFolderHover"></span>
      </button>
      <button class="tb-icon news-save-top-btn" id="newsSaveTopBtn" type="button" onclick="saveNewsArticle(true)"
        title="Save Article" aria-label="Save Article">
        <span data-lm-icon="saveOutline"></span>
        <span data-lm-icon="saveFilled"></span>
      </button>
      <button class="tb-icon theme-menu-btn lm-id-darkBtn" id="darkBtn" type="button"
        onclick="toggleThemePanel(event)" title="Theme" aria-label="Choose theme" aria-expanded="false"
        aria-controls="themeModePanel">
        <span data-lm-icon="themeModeDefault"></span>
        <span data-lm-icon="themeModeHover"></span>
      </button>
      <div class="theme-mode-panel lm-id-themeModePanel" id="themeModePanel" hidden>
        <button class="theme-mode-option lm-id-themeLightBtn" id="themeLightBtn" type="button"
          onclick="selectThemeMode('light')">Light</button>
        <button class="theme-mode-option lm-id-themeGreyBtn" id="themeGreyBtn" type="button"
          onclick="selectThemeMode('grey')">Grey</button>
        <button class="theme-mode-option theme-mode-more-btn lm-id-themeMoreBtn" id="themeMoreBtn" type="button"
          onclick="toggleMoreThemeOptions(event)" aria-expanded="false" aria-controls="themeMoreOptions">
          <span>More themes</span><span class="theme-mode-more-arrow" aria-hidden="true">›</span>
        </button>
        <div class="theme-mode-more-options lm-id-themeMoreOptions" id="themeMoreOptions" hidden>
          <button class="theme-mode-option lm-id-themeDarkBtn" id="themeDarkBtn" type="button"
            onclick="selectThemeMode('dark')">Dark</button>
          <button class="theme-mode-option lm-id-themePurpleBtn" id="themePurpleBtn" type="button"
            onclick="selectThemeMode('purple')">Purple</button>
          <button class="theme-mode-option lm-id-themeSunsetBtn" id="themeSunsetBtn" type="button"
            onclick="selectThemeMode('sunset')">Sunset</button>
          <button class="theme-mode-option lm-id-themeForestBtn" id="themeForestBtn" type="button"
            onclick="selectThemeMode('forest')">Forest</button>
        </div>
      </div>
    </div>
  </div>

  <main class="newsdesk-page">
    <aside class="newsdesk-sidebar lm-id-newsdeskSidebar lm-theme-purple" id="newsdeskSidebar"></aside>

    <section class="newsdesk-editor-shell">
      <div class="newsdesk-toolbar lm-id-newsdeskToolbar lm-theme-purple" id="newsdeskToolbar"></div>
      <div class="newsdesk-floating-tools is-collapsed lm-id-newsdeskFloatingTools lm-theme-purple" id="newsdeskFloatingTools"></div>
      <div class="newsdesk-editor-scroll" id="newsdeskEditorScroll">
        <article class="newsdesk-paper lm-id-newsdeskPaper lm-theme-purple" id="newsdeskPaper"></article>
      </div>
    </section>

    <aside class="newsdesk-inspector" id="newsdeskInspector"></aside>
  </main>

  <div class="newsdesk-toast" id="newsdeskToast" aria-live="polite"></div>

  <script src="assets/shared/js/00-icon-registry.js?v=20260608-collapse-chevron-icon"></script>
  <script src="assets/shared/js/01-shortcut-tooltips.js?v=20260608-file-renames"></script>
  <script src="assets/shared/js/02-floating-panel-focus-return.js?v=20260608-file-renames"></script>
  <script src="assets/shared/js/03-theme-controller.js?v=20260906-theme-variant-switch-final"></script>
  <script src="assets/shared/js/04a-state-defaults-normalization.js?v=20260905-null-source-orphan"></script>
  <script src="assets/shared/js/04b-editor-document-state.js?v=20260903-js-module-split"></script>
  <script src="assets/shared/js/05-floating-panel-positions.js?v=20260609-naming-description-position"></script>
  <script src="assets/shared/js/06a-project-storage-foundation.js?v=20260904-naming-data-safety"></script>
  <script src="assets/shared/js/06aa-naming-file-safety.js?v=20260905-authoritative-import"></script>
  <script src="assets/shared/js/06b-workspace-restore-autosave.js?v=20260903-js-module-split"></script>
  <script src="assets/shared/js/06c-workspace-library-settings.js?v=20260903-js-module-split"></script>
  <script src="assets/shared/js/06d-editor-paste-settings.js?v=20260905-portable-naming-selects"></script>
  <script src="assets/pages/news-article-editor/js/00-news-editor.js?v=20260611-newsdesk-floating-tools"></script>
</body>

</html>
