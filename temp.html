<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plain Text Editor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Poppins', sans-serif;

            background:
                radial-gradient(circle at top left, #ffb34733, transparent 35%),
                radial-gradient(circle at bottom right, #ff7b0033, transparent 35%),
                linear-gradient(135deg, #1a120b, #2c1810, #120d08);
        }

        .editor-box {
            width: 80vw;
            height: 80vh;

            overflow-y: auto;
            padding: 40px;

            background: rgba(255, 255, 255, .05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 24px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, .45),
                inset 0 0 0 1px rgba(255, 255, 255, .05);
        }

        .editor {
            min-height: 100%;
            outline: none;

            color: #f7e6d0;

            font-size: 18px;
            line-height: 1.9;
            text-align: justify;

            white-space: pre-wrap;
            word-break: break-word;
        }

        .editor:empty::before {
            content: "यहाँ अपना टेक्स्ट लिखें...";
            color: rgba(255, 255, 255, .45);
            pointer-events: none;
        }

        .editor-box::-webkit-scrollbar {
            width: 10px;
        }

        .editor-box::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, .05);
            border-radius: 10px;
        }

        .editor-box::-webkit-scrollbar-thumb {
            background: #d68b30;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="editor-box">
        <p id="editor" class="editor" contenteditable="true"></p>
    </div>

    <script>
        const editor = document.getElementById("editor");

        /*
          Enter को वास्तविक \n में बदलो।
          कोई नया HTML टैग नहीं बनेगा।
        */
        editor.addEventListener("beforeinput", function (e) {

            if (e.inputType === "insertParagraph") {
                e.preventDefault();

                const selection = window.getSelection();

                if (!selection.rangeCount) return;

                const range = selection.getRangeAt(0);

                const textNode = document.createTextNode("\n");

                range.deleteContents();
                range.insertNode(textNode);

                range.setStartAfter(textNode);
                range.collapse(true);

                selection.removeAllRanges();
                selection.addRange(range);
            }
        });

        /*
          Paste करते समय भी HTML हटाकर केवल plain text रखो।
        */
        editor.addEventListener("paste", function (e) {

            e.preventDefault();

            const text =
                (e.clipboardData || window.clipboardData)
                    .getData("text");

            const selection = window.getSelection();

            if (!selection.rangeCount) return;

            const range = selection.getRangeAt(0);

            range.deleteContents();

            const node = document.createTextNode(text);

            range.insertNode(node);

            range.setStartAfter(node);
            range.collapse(true);

            selection.removeAllRanges();
            selection.addRange(range);
        });

        console.log(
            "Content will always be plain text:",
            editor.textContent
        );
    </script>

</body>

</html>
