services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: lekhak
      POSTGRES_USER: lekhak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password in server/.env}
    ports:
      - "127.0.0.1:${LEKHAK_DB_PORT:-5432}:5432"
    volumes:
      - lekhak_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lekhak -d lekhak"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  lekhak_database:
